name: Update casks

# Every hour, check for a new Mac Memory Monitor release and update the cask to it.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump mac-memory-monitor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CASK=Casks/mac-memory-monitor.rb
          TAG=$(gh release view -R ryan-helou/MacMemoryMonitor --json tagName,isDraft -q 'select(.isDraft==false) | .tagName')
          VERSION=${TAG#v}
          CURRENT=$(sed -n 's/^  version "\(.*\)"/\1/p' $CASK)
          if [ "$VERSION" = "$CURRENT" ]; then echo "Already on $VERSION"; exit 0; fi
          URL="https://github.com/ryan-helou/MacMemoryMonitor/releases/download/$TAG/MacMemoryMonitor-$VERSION.zip"
          curl -sfL -o app.zip "$URL"
          SHA=$(sha256sum app.zip | cut -d' ' -f1)
          sed -i "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" $CASK
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "mac-memory-monitor $VERSION"
          git push
