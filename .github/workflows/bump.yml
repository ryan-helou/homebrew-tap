name: Update casks

# Every hour, check each app for a new release and update its cask.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bump casks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # cask file | repo | zip name prefix
          while IFS='|' read -r CASK REPO PREFIX; do
            TAG=$(gh release view -R "$REPO" --json tagName,isDraft -q 'select(.isDraft==false) | .tagName')
            VERSION=${TAG#v}
            CURRENT=$(sed -n 's/^  version "\(.*\)"/\1/p' "$CASK")
            if [ "$VERSION" = "$CURRENT" ]; then echo "$CASK already on $VERSION"; continue; fi
            URL="https://github.com/$REPO/releases/download/$TAG/$PREFIX-$VERSION.zip"
            curl -sfL -o app.zip "$URL"
            SHA=$(sha256sum app.zip | cut -d' ' -f1)
            rm app.zip
            sed -i "s/^  version \".*\"/  version \"$VERSION\"/; s/^  sha256 \".*\"/  sha256 \"$SHA\"/" "$CASK"
            git commit -am "$(basename "$CASK" .rb) $VERSION"
          done <<'LIST'
          Casks/mac-memory-monitor.rb|ryan-helou/MacMemoryMonitor|MacMemoryMonitor
          Casks/music-notch.rb|ryan-helou/MusicNotch|MusicNotch
          LIST
          git push
